# Contrôle automatique à chaque envoi :
# - controle : la source passe tools/check.ps1 sous Windows PowerShell 5.1, et le JARVIS.cmd du dépôt est bien celui
#   que build.py fabrique à partir de la source ;
# - scan : le JARVIS.cmd du dépôt fait un vrai scan rapide, sans clavier, sans aucune action (tools/scan-essai.ps1,
#   v3.25, constat T1 de l'audit : le programme principal n'était exécuté par aucun test).
# tools/publier.py exige ces deux contrôles réussis sur le commit avant de publier une version.
# Branches seulement : l'étiquette créée par une publication porte sur un commit déjà contrôlé, et un second
# passage en cours faisait échouer « publier.py --verifier » juste après la publication (v3.25, 23/11/2026).
name: Controle

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Save-Module -Name PSScriptAnalyzer -Repository PSGallery -Path .modules -Force

      - name: Controle de la source
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\check.ps1 -RequireAnalyzer

      - name: Fabrication
        shell: powershell
        run: python build.py

      - name: JARVIS.cmd du depot = JARVIS.cmd fabrique
        shell: powershell
        run: |
          git diff --exit-code -- JARVIS.cmd
          if ($LASTEXITCODE -ne 0) { Write-Host 'JARVIS.cmd ne correspond pas a la source : lance python build.py avant le commit.'; exit 1 }

  scan:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Scan rapide de JARVIS.cmd (sans clavier, aucune action)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\scan-essai.ps1 -Mode cmd -OutDir "$env:RUNNER_TEMP\scan-essai"

      - name: Journal et rapport du scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-essai
          path: ${{ runner.temp }}/scan-essai/
          retention-days: 7
          if-no-files-found: ignore
